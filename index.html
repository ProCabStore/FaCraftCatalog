<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Product Catalog</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1b1b1b;
    background: #faf9f7;
    line-height: 1.5;
  }
  /* ---------- HEADER (sticky: brand + search + filter bar) ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #e9e5df;
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto; padding: 14px 20px 12px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: .02em; margin: 0; }
  .brand span { color: #8a7a63; font-weight: 400; font-size: .85rem; display: block; }
  .search {
    margin-left: auto; flex: 1 1 220px; max-width: 320px;
    padding: 10px 14px; border: 1px solid #ddd7cf; border-radius: 999px;
    font-size: .9rem; outline: none; background: #fff;
  }
  .search:focus { border-color: #8a7a63; }

  /* ---------- FILTER BAR ---------- */
  .filterbar { position: relative; border-top: 1px solid #f1ede7; }
  .filterbar-inner {
    max-width: 1200px; margin: 0 auto; padding: 9px 20px;
    display: flex; align-items: center; gap: 8px;
  }

  /* horizontally scrolling chip rail */
  .chips {
    flex: 1 1 auto; min-width: 0;
    display: flex; gap: 8px;
    overflow-x: auto; overflow-y: hidden;
    scroll-behavior: smooth;
    scrollbar-width: none; -ms-overflow-style: none;
    padding: 2px 0;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto; white-space: nowrap;
    padding: 8px 16px; border-radius: 999px; border: 1px solid #ddd7cf;
    background: #fff; font-size: .85rem; cursor: pointer; color: #4a4a4a;
    transition: .15s; font-family: inherit;
  }
  .chip:hover { border-color: #8a7a63; color: #1b1b1b; }
  .chip.active { background: #1b1b1b; border-color: #1b1b1b; color: #fff; }

  /* scroll arrows — only shown when the rail overflows */
  .scroll-btn {
    display: none; flex: 0 0 auto;
    width: 28px; height: 28px; padding: 0;
    border-radius: 50%; border: 1px solid #e2dcd3; background: #fff;
    color: #6b6b6b; cursor: pointer; font-family: inherit;
    font-size: 1rem; line-height: 1;
    align-items: center; justify-content: center;
  }
  .filterbar-inner.can-scroll .scroll-btn { display: flex; }
  .scroll-btn:hover:not(:disabled) { border-color: #8a7a63; color: #1b1b1b; }
  .scroll-btn:disabled { opacity: .3; cursor: default; }

  /* "Categories" dropdown trigger */
  .cat-toggle {
    flex: 0 0 auto; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid #ddd7cf; background: #fff; color: #4a4a4a;
    font-size: .85rem; font-family: inherit; cursor: pointer;
    transition: .15s;
  }
  .cat-toggle:hover { border-color: #8a7a63; color: #1b1b1b; }
  .cat-toggle svg { flex: 0 0 auto; }
  .cat-toggle .chev { font-size: .7rem; transition: transform .18s; }
  .cat-toggle[aria-expanded="true"] { border-color: #1b1b1b; color: #1b1b1b; }
  .cat-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* dropdown panel listing every category */
  .cat-panel {
    position: absolute; left: 0; right: 0; top: 100%;
    display: none;
    background: #fff;
    border-bottom: 1px solid #e9e5df;
    box-shadow: 0 20px 40px -16px rgba(0,0,0,.22);
    z-index: 40;
  }
  .cat-panel.open { display: block; animation: panelIn .14s ease-out; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(-6px); } }

  .cat-panel-inner { max-width: 1200px; margin: 0 auto; padding: 14px 20px 18px; }
  .cat-panel-head { display: flex; gap: 8px; align-items: center; }
  .cat-search {
    flex: 1 1 auto; min-width: 0;
    padding: 9px 15px; border: 1px solid #ddd7cf; border-radius: 999px;
    font-size: .85rem; font-family: inherit; outline: none; background: #fff;
  }
  .cat-search:focus { border-color: #8a7a63; }
  .cat-close {
    flex: 0 0 auto; width: 34px; height: 34px; padding: 0;
    border-radius: 50%; border: 1px solid #e2dcd3; background: #fff;
    color: #777; cursor: pointer; font-family: inherit; font-size: .8rem;
  }
  .cat-close:hover { border-color: #8a7a63; color: #1b1b1b; }

  .cat-list {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 6px;
    max-height: 46vh; overflow-y: auto;
    scrollbar-width: thin;
  }
  .cat-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 13px; border-radius: 10px;
    border: 1px solid #f0ece6; background: #fbfaf8;
    font-size: .84rem; font-family: inherit; color: #3d3d3d;
    text-align: left; cursor: pointer; transition: .13s;
  }
  .cat-item:hover { background: #f3efe9; border-color: #e3dbd0; }
  .cat-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-item .n { flex: 0 0 auto; font-size: .7rem; color: #a89880; }
  .cat-item.active { background: #1b1b1b; border-color: #1b1b1b; color: #fff; }
  .cat-item.active .n { color: rgba(255,255,255,.6); }
  .cat-empty { margin: 6px 2px; font-size: .84rem; color: #999; }

  /* ---------- COUNT / GRID ---------- */
  .count { max-width: 1200px; margin: 0 auto; padding: 14px 20px 0; font-size: .8rem; color: #8a8a8a; }
  .grid {
    max-width: 1200px; margin: 0 auto; padding: 14px 20px 60px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;
  }
  .card {
    background: #fff; border: 1px solid #ece8e2; border-radius: 14px;
    overflow: hidden; cursor: pointer; transition: .18s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }

  /* === 4:5 PORTRAIT IMAGE FRAME === */
  .thumb { position: relative; aspect-ratio: 4 / 5; background: #f2eee9; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .img-count {
    position: absolute; right: 8px; bottom: 8px;
    background: rgba(20,18,15,.72); color: #fff;
    font-size: .66rem; letter-spacing: .02em;
    padding: 3px 9px; border-radius: 999px;
    pointer-events: none;
  }

  .card-body { padding: 13px 14px 16px; }
  .cat-tag {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .09em;
    color: #a89880; font-weight: 600;
  }
  .card-body h3 { margin: 4px 0 6px; font-size: .95rem; font-weight: 600; }
  .price { font-weight: 700; font-size: .95rem; }
  .empty { text-align: center; color: #999; padding: 60px 20px; display: none; }

  /* ---------- MODAL ---------- */
  .modal {
    position: fixed; inset: 0; background: rgba(20,18,15,.72);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 16px; overflow: hidden;
    max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto;
    display: grid; grid-template-columns: 1fr 1.1fr;
    align-items: start;
  }

  /* === 4:5 PORTRAIT IN POP-UP TOO === */
  .modal-media { background: #f2eee9; display: flex; flex-direction: column; }
  .modal-img { aspect-ratio: 4 / 5; overflow: hidden; }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .modal-info { padding: 26px 26px 24px; display: flex; flex-direction: column; gap: 8px; }
  .modal-info h2 { margin: 0; font-size: 1.35rem; }
  .modal-info .price { font-size: 1.2rem; }
  .modal-info p.desc { color: #666; font-size: .88rem; margin: 2px 0 4px; }

  /* ---------- GALLERY THUMBNAIL STRIPS ---------- */
  .m-thumbs, .lb-thumbs {
    display: flex; gap: 8px; padding: 10px;
    overflow-x: auto; background: #f2eee9;
    border-top: 1px solid #e6e0d8;
    scrollbar-width: thin;
  }
  .m-thumbs:empty, .lb-thumbs:empty { display: none; }
  .gal-thumb {
    flex: 0 0 auto; width: 54px; height: 66px; padding: 0;
    border: 2px solid transparent; border-radius: 8px; overflow: hidden;
    background: #fff; cursor: pointer; opacity: .62; transition: .15s;
    font-family: inherit;
  }
  .gal-thumb:hover { opacity: 1; }
  .gal-thumb.active { border-color: #1b1b1b; opacity: 1; }
  .gal-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- MATERIAL / FINISHING SECTIONS ---------- */
  .variety-section { margin-top: 16px; }
  .variety-section + .variety-section { margin-top: 20px; }
  .variety-section h4 {
    margin: 0 0 10px; font-size: .7rem; text-transform: uppercase;
    letter-spacing: .1em; color: #a89880; font-weight: 700;
  }
  .variety-list { display: flex; flex-direction: column; gap: 8px; }
  .variety-item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 8px; border: 1px solid #efeae3; border-radius: 12px;
    background: #fdfcfa; cursor: zoom-in; font-family: inherit; text-align: left;
    transition: .15s;
  }
  .variety-item:hover { border-color: #d6cbba; background: #fff; }
  .v-thumb {
    position: relative;
    width: 58px; height: 58px; flex: 0 0 58px;
    border-radius: 9px; overflow: hidden; background: #f2eee9;
  }
  .v-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .v-thumb .img-count { right: 3px; bottom: 3px; font-size: .55rem; padding: 1px 5px; }
  .v-text { min-width: 0; }
  .v-name { font-size: .87rem; font-weight: 600; margin-bottom: 1px; }
  .v-desc { font-size: .77rem; color: #7a7a7a; line-height: 1.35; }

  /* ---------- ACTIONS ---------- */
  .modal-actions { margin-top: 22px; display: flex; flex-direction: column; gap: 8px; }
  .wa-btn {
    display: inline-block; text-align: center; text-decoration: none;
    background: #25d366; color: #fff; padding: 13px; border-radius: 10px;
    font-weight: 600; font-size: .92rem;
  }
  .close-btn {
    background: none; border: 1px solid #ddd; border-radius: 10px;
    padding: 11px; cursor: pointer; font-family: inherit; font-size: .88rem; color: #555;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox {
    position: fixed; inset: 0; background: rgba(20,18,15,.88);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 70;
  }
  .lightbox.open { display: flex; }
  .lb-box {
    background: #fff; border-radius: 16px; overflow: hidden;
    max-width: 480px; width: 100%; max-height: 90vh;
    display: flex; flex-direction: column;
  }
  .lb-img { background: #f2eee9; width: 100%; aspect-ratio: 1 / 1; max-height: 46vh; }
  .lb-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lb-info { padding: 18px 20px 20px; overflow-y: auto; }
  .lb-info h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .lb-info p { margin: 0 0 14px; font-size: .85rem; color: #666; line-height: 1.45; }
  .lb-close {
    width: 100%; background: none; border: 1px solid #ddd; border-radius: 10px;
    padding: 11px; cursor: pointer; font-family: inherit; font-size: .88rem; color: #555;
  }

  footer { text-align: center; padding: 24px; font-size: .8rem; color: #9a9a9a; }

  @media (max-width: 700px) {
    .header-inner { padding: 12px 16px 10px; }
    .filterbar-inner { padding: 8px 16px; gap: 6px; }
    .scroll-btn { display: none !important; }   /* touch scroll instead */
    .cat-toggle-label { display: none; }
    .cat-toggle { padding: 8px 11px; }
    .cat-panel-inner { padding: 12px 16px 16px; }
    .cat-list { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); max-height: 52vh; }
    .count { padding: 12px 16px 0; }
    .modal-box { grid-template-columns: 1fr; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 12px 16px 50px; }
    .card-body { padding: 10px 10px 13px; }
    .modal-info { padding: 20px; }
    .gal-thumb { width: 46px; height: 56px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1 class="brand">My Catalog <span>Furniture &amp; Home</span></h1>
    <input class="search" id="search" type="search" placeholder="Search products…">
  </div>

  <!-- FILTER BAR: scrolling chip rail + full category dropdown -->
  <div class="filterbar" id="filterbar">
    <div class="filterbar-inner" id="filterbarInner">
      <button class="scroll-btn" id="chipPrev" type="button" aria-label="Scroll categories left">‹</button>
      <div class="chips" id="filters"></div>
      <button class="scroll-btn" id="chipNext" type="button" aria-label="Scroll categories right">›</button>

      <button class="cat-toggle" id="catToggle" type="button"
              aria-expanded="false" aria-controls="catPanel" aria-haspopup="true">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="1.5" y="1.5" width="5" height="5" rx="1.2"/>
          <rect x="9.5" y="1.5" width="5" height="5" rx="1.2"/>
          <rect x="1.5" y="9.5" width="5" height="5" rx="1.2"/>
          <rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/>
        </svg>
        <span class="cat-toggle-label">Categories</span>
        <span class="chev" aria-hidden="true">▾</span>
      </button>
    </div>

    <div class="cat-panel" id="catPanel">
      <div class="cat-panel-inner">
        <div class="cat-panel-head">
          <input class="cat-search" id="catSearch" type="search" placeholder="Find a category…">
          <button class="cat-close" id="catClose" type="button" aria-label="Close categories">✕</button>
        </div>
        <div class="cat-list" id="catList"></div>
      </div>
    </div>
  </div>
</header>

<div class="count" id="count"></div>
<main class="grid" id="grid"></main>
<p class="empty" id="empty">No products found.</p>

<!-- PRODUCT POP-UP -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-media">
      <div class="modal-img"><img id="mImg" alt=""></div>
      <div class="m-thumbs" id="mThumbs"></div>
    </div>
    <div class="modal-info">
      <span class="cat-tag" id="mCat"></span>
      <h2 id="mName"></h2>
      <div class="price" id="mPrice"></div>
      <p class="desc" id="mDesc"></p>

      <!-- Material / Finishing sections are injected here -->
      <div id="mVariety"></div>

      <div class="modal-actions">
        <a class="wa-btn" id="mWa" target="_blank" rel="noopener">WhatsApp</a>
        <button class="close-btn" id="closeBtn">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- REFERENCE PHOTO LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lb-box">
    <div class="lb-img"><img id="lbImg" alt=""></div>
    <div class="lb-thumbs" id="lbThumbs"></div>
    <div class="lb-info">
      <h3 id="lbName"></h3>
      <p id="lbDesc"></p>
      <button class="lb-close" id="lbClose">Close</button>
    </div>
  </div>
</div>

<footer>© <span id="year"></span> My Catalog — all prices subject to change.</footer>

<script>
/* =========================================================================
   1) YOUR WHATSAPP NUMBER — country code, no +, no spaces, no dashes
   ========================================================================= */
const WHATSAPP_NUMBER = "601111213149";

/* =========================================================================
   2) MATERIAL VARIETY  (shown on every product by default)
   `ids` = array of Google Drive FILE IDs (first one = cover photo)
   `id`  = single-file shorthand still works
   ========================================================================= */
const materials = [
  {
    name: "Rubberwood",

];

/* =========================================================================
   3) FINISHING VARIETY
   ========================================================================= */
const finishes = [
  {
    name: "Clear Coating",
    ids:  ["1OmsCu-Z1WIBvOYJSJdw1nptLNH6bS7Ix"],

      "1IcHFRx1D3wdBII1gNdzBTjBCKcpjFZrD",

    ],

/* =========================================================================
   4) CATEGORY HELPER — lets a product belong to one or many categories.
   Use `categories: ["A", "B"]` for multiple, or the old `category: "A"`.
   Both styles can be mixed freely.
   ========================================================================= */
const catsOf = p => p.categories || (p.category ? [p.category] : []);

/* =========================================================================

  if (Array.isArray(x.ids)) return x.ids.filter(Boolean);
  return x.id ? [x.id] : [];
};

  },

/* ---------- Image URL helpers (handles Google Drive quirks) ---------- */
const thumbUrl = (id, size) => `https://drive.google.com/thumbnail?id=${id}&sz=w${size}`;

const PLACEHOLDER =
  "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500">
       <rect width="400" height="500" fill="#f2eee9"/>
       <text x="50%" y="50%" font-family="sans-serif" font-size="15"
             fill="#b0a698" text-anchor="middle">Image unavailable</text>
     </svg>`);

/* Try thumbnail URL, then lh3 URL, then placeholder */
window.imgFallback = function (img) {
  const id = img.dataset.id;
  if (!id) { img.onerror = null; img.src = PLACEHOLDER; return; }
  if (!img.dataset.tried) {
    img.dataset.tried = "1";
    img.src = `https://lh3.googleusercontent.com/d/${id}`;
  } else {
    img.onerror = null;
    img.src = PLACEHOLDER;
  }
};

/* Point an <img> at a given file id (or the placeholder when there is none) */
function setImgSrc(el, id, size) {
  el.onerror = null;
  el.dataset.tried = "";
  el.dataset.id = id || "";
  if (!id) { el.src = PLACEHOLDER; return; }
  el.onerror = function () { imgFallback(this); };
  el.src = thumbUrl(id, size);
}

/* Small "<img>" tag for a grid / variety thumbnail */
function thumbTag(id, size) {
  if (!id) return `<img src="${PLACEHOLDER}" alt="">`;
  return `<img loading="lazy" data-id="${id}" src="${thumbUrl(id, size)}"
               onerror="imgFallback(this)" alt="">`;
}

/* Thumbnail strip markup (empty string when there is only one photo) */
function galleryHTML(ids, activeIndex) {
  if (ids.length < 2) return "";
  return ids.map((id, i) => `
    <button class="gal-thumb${i === activeIndex ? " active" : ""}"
            data-i="${i}" aria-label="Photo ${i + 1} of ${ids.length}">
      ${thumbTag(id, 200)}
    </button>
  `).join("");
}

/* Tiny text escaper for category names coming out of the data */
const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

/* ---------- State ---------- */
let activeCategory = "All";
let searchTerm = "";
let categoryList = [];          // [{ name, count }]

let modalIds = [];
let lbIds = [];

const gridEl        = document.getElementById("grid");
const countEl       = document.getElementById("count");
const emptyEl       = document.getElementById("empty");
const searchEl      = document.getElementById("search");
const modal         = document.getElementById("modal");
const lightbox      = document.getElementById("lightbox");

const mImg          = document.getElementById("mImg");
const mThumbs       = document.getElementById("mThumbs");
const lbImg         = document.getElementById("lbImg");
const lbThumbs      = document.getElementById("lbThumbs");

/* category UI */
const chipsEl       = document.getElementById("filters");
const filterbarIn   = document.getElementById("filterbarInner");
const chipPrev      = document.getElementById("chipPrev");
const chipNext      = document.getElementById("chipNext");
const catToggle     = document.getElementById("catToggle");
const catPanel      = document.getElementById("catPanel");
const catList       = document.getElementById("catList");
const catSearch     = document.getElementById("catSearch");
const catClose      = document.getElementById("catClose");

/* =========================================================================
   CATEGORY INDEX — collected once from the products, de-duplicated,
   alphabetical (scales far better than insertion order once you have
   dozens of categories), with a product count per category.
   ========================================================================= */
function collectCategories() {
  const map = new Map();
  products.forEach(p => catsOf(p).forEach(c => map.set(c, (map.get(c) || 0) + 1)));
  return [...map.entries()]
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

/* All categories prefixed with "All" */
function categoriesWithAll() {
  return [{ name: "All", count: products.length }, ...categoryList];
}

/* ---------- Scrollable chip rail ---------- */
function buildChipRail() {
  chipsEl.innerHTML = categoriesWithAll().map(c =>
    `<button class="chip${c.name === activeCategory ? " active" : ""}"
             type="button" data-cat="${esc(c.name)}">${esc(c.name)}</button>`
  ).join("");
  updateScrollButtons();
  requestAnimationFrame(() => {
    const active = chipsEl.querySelector(".chip.active");
    if (active) scrollChipIntoView(active);
  });
}

function updateScrollButtons() {
  const max = chipsEl.scrollWidth - chipsEl.clientWidth;
  filterbarIn.classList.toggle("can-scroll", max > 4);
  chipPrev.disabled = chipsEl.scrollLeft <= 2;
  chipNext.disabled = chipsEl.scrollLeft >= max - 2;
}

function scrollChipIntoView(chip) {
  const rail = chipsEl.getBoundingClientRect();
  const r = chip.getBoundingClientRect();
  if (r.left < rail.left) {
    chipsEl.scrollTo({ left: chipsEl.scrollLeft - (rail.left - r.left) - 14, behavior: "smooth" });
  } else if (r.right > rail.right) {
    chipsEl.scrollTo({ left: chipsEl.scrollLeft + (r.right - rail.right) + 14, behavior: "smooth" });
  }
}

/* ---------- Full category dropdown ---------- */
function buildCatList(filterText = "") {
  const q = filterText.trim().toLowerCase();
  const items = categoriesWithAll().filter(c => !q || c.name.toLowerCase().includes(q));

  if (!items.length) {
    catList.innerHTML = `<p class="cat-empty">No category matches “${esc(filterText)}”.</p>`;
    return;
  }
  catList.innerHTML = items.map(c => `
    <button class="cat-item${c.name === activeCategory ? " active" : ""}"
            type="button" data-cat="${esc(c.name)}">
      <span>${esc(c.name)}</span>
      <span class="n">${c.count}</span>
    </button>`).join("");
}

function openCatPanel() {
  buildCatList();
  catSearch.value = "";
  catPanel.classList.add("open");
  catToggle.setAttribute("aria-expanded", "true");
  if (window.innerWidth > 700) catSearch.focus();
}

function closeCatPanel() {
  catPanel.classList.remove("open");
  catToggle.setAttribute("aria-expanded", "false");
}

/* ---------- Switch category (single source of truth) ---------- */
function setActiveCategory(cat) {
  activeCategory = cat;

  [...chipsEl.children].forEach(b =>
    b.classList.toggle("active", b.dataset.cat === cat));
  [...catList.children].forEach(b =>
    b.classList.toggle("active", b.dataset.cat === cat));

  const activeChip = chipsEl.querySelector(".chip.active");
  if (activeChip) scrollChipIntoView(activeChip);

  render();
}

/* ---------- Render products ---------- */
function render() {
  const q = searchTerm.toLowerCase();
  const list = products.filter(p => {
    const matchCat = activeCategory === "All" || catsOf(p).includes(activeCategory);
    const matchQ = !q ||
      p.name.toLowerCase().includes(q) ||
      catsOf(p).join(" ").toLowerCase().includes(q) ||
      (p.desc || "").toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  gridEl.innerHTML = list.map(p => {
    const ids   = idsOf(p);
    const cover = ids[0] || "";
    const badge = ids.length > 1
      ? `<span class="img-count">1 / ${ids.length}</span>`
      : "";

    return `
      <article class="card" data-key="${products.indexOf(p)}">
        <div class="thumb">
          ${thumbTag(cover, 700)}
          ${badge}
        </div>
        <div class="card-body">
          <div class="cat-tag">${catsOf(p).map(esc).join(" · ")}</div>
          <h3>${esc(p.name)}</h3>
          <div class="price">${p.price || ""}</div>
        </div>
      </article>
    `;
  }).join("");

  const label = activeCategory === "All" ? "" : ` · ${activeCategory}`;
  countEl.textContent = `${list.length} product${list.length === 1 ? "" : "s"}${label}`;
  emptyEl.style.display = list.length ? "none" : "block";

  updateScrollButtons();
}

/* ---------- Build one variety block ---------- */
function varietyHTML(title, type, items) {
  if (!items.length) return "";
  return `
    <div class="variety-section">
      <h4>${title}</h4>
      <div class="variety-list">
        ${items.map(m => {
          const ids = idsOf(m);
          const badge = ids.length > 1
            ? `<span class="img-count">${ids.length}</span>`
            : "";
          return `
          <button class="variety-item" data-type="${type}" data-name="${m.name}">
            <div class="v-thumb">
              ${thumbTag(ids[0] || "", 200)}
              ${badge}
            </div>
            <div class="v-text">
              <div class="v-name">${m.name}</div>
              <div class="v-desc">${m.desc || ""}</div>
            </div>
          </button>`;
        }).join("")}
      </div>
    </div>`;
}

/* Show only the varieties a product lists (or all if it lists none) */
function pickVariety(all, names) {
  if (!names || !names.length) return all;
  return all.filter(x => names.includes(x.name));
}

/* ---------- Product modal ---------- */
function openModal(key) {
  const p = products[key];
  if (!p) return;

  modalIds = idsOf(p);

  setImgSrc(mImg, modalIds[0] || "", 1600);
  mImg.alt = p.name;
  mThumbs.innerHTML = galleryHTML(modalIds, 0);
  mThumbs.scrollLeft = 0;

  document.getElementById("mCat").textContent   = catsOf(p).join(" · ");
  document.getElementById("mName").textContent  = p.name;
  document.getElementById("mPrice").textContent = p.price || "";
  document.getElementById("mDesc").textContent  = p.desc || "";

  document.getElementById("mVariety").innerHTML =
    varietyHTML("Material Options", "material", pickVariety(materials, p.materials)) +
    varietyHTML("Finishing Options", "finish",  pickVariety(finishes,  p.finishes));

  document.getElementById("mWa").href =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Hi, I'm interested in: " + p.name)}`;

  document.querySelector(".modal-box").scrollTop = 0;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  modal.classList.remove("open");
  document.body.style.overflow = "";
}

/* ---------- Reference photo lightbox ---------- */
function openLightbox(type, name) {
  const source = type === "material" ? materials : finishes;
  const item = source.find(x => x.name === name);
  if (!item) return;

  lbIds = idsOf(item);

  setImgSrc(lbImg, lbIds[0] || "", 1200);
  lbImg.alt = item.name;
  lbThumbs.innerHTML = galleryHTML(lbIds, 0);
  lbThumbs.scrollLeft = 0;

  document.getElementById("lbName").textContent = item.name;
  document.getElementById("lbDesc").textContent = item.desc || "";

  lightbox.classList.add("open");
}

function closeLightbox() {
  lightbox.classList.remove("open");
}

/* =========================================================================
   EVENTS
   ========================================================================= */

/* chip rail clicks */
chipsEl.addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  closeCatPanel();
  setActiveCategory(btn.dataset.cat);
});

/* rail scroll position → enable/disable arrows */
let scrollTick = false;
chipsEl.addEventListener("scroll", () => {
  if (scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(() => { updateScrollButtons(); scrollTick = false; });
});

chipPrev.addEventListener("click", () =>
  chipsEl.scrollBy({ left: -Math.max(180, chipsEl.clientWidth * 0.7), behavior: "smooth" }));
chipNext.addEventListener("click", () =>
  chipsEl.scrollBy({ left:  Math.max(180, chipsEl.clientWidth * 0.7), behavior: "smooth" }));

window.addEventListener("resize", updateScrollButtons);

/* dropdown open / close */
catToggle.addEventListener("click", () => {
  catPanel.classList.contains("open") ? closeCatPanel() : openCatPanel();
});
catClose.addEventListener("click", closeCatPanel);

catSearch.addEventListener("input", e => buildCatList(e.target.value));

catList.addEventListener("click", e => {
  const btn = e.target.closest(".cat-item");
  if (!btn) return;
  setActiveCategory(btn.dataset.cat);
  closeCatPanel();
});

/* click outside the filter bar closes the dropdown */
document.addEventListener("click", e => {
  if (!catPanel.classList.contains("open")) return;
  if (!e.target.closest("#filterbar")) closeCatPanel();
});

/* search box */
searchEl.addEventListener("input", e => {
  searchTerm = e.target.value.trim();
  render();
});

/* open product */
gridEl.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) openModal(card.dataset.key);
});

/* Click a material / finish row → enlarge its reference photos */
document.getElementById("mVariety").addEventListener("click", e => {
  const item = e.target.closest(".variety-item");
  if (item) openLightbox(item.dataset.type, item.dataset.name);
});

/* Click a thumbnail in the product gallery → swap the big photo */
mThumbs.addEventListener("click", e => {
  const btn = e.target.closest(".gal-thumb");
  if (!btn) return;
  const i = Number(btn.dataset.i);
  setImgSrc(mImg, modalIds[i], 1600);
  [...mThumbs.children].forEach((c, j) => c.classList.toggle("active", j === i));
});

/* Click a thumbnail in the lightbox gallery → swap the big photo */
lbThumbs.addEventListener("click", e => {
  const btn = e.target.closest(".gal-thumb");
  if (!btn) return;
  const i = Number(btn.dataset.i);
  setImgSrc(lbImg, lbIds[i], 1200);
  [...lbThumbs.children].forEach((c, j) => c.classList.toggle("active", j === i));
});

document.getElementById("closeBtn").addEventListener("click", closeModal);
document.getElementById("lbClose").addEventListener("click", closeLightbox);

modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (lightbox.classList.contains("open")) closeLightbox();
  else if (modal.classList.contains("open")) closeModal();
  else if (catPanel.classList.contains("open")) closeCatPanel();
});

/* ---------- Init ---------- */
document.getElementById("year").textContent = new Date().getFullYear();
categoryList = collectCategories();
buildChipRail();
buildCatList();
render();
</script>
